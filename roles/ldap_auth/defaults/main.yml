---
# This role wires vault to an ALREADY-EXISTING peer. It receives every endpoint and
# credential as a variable and never discovers or retrieves them (BLUEPRINTS_INTEGRATION_STANDARDS.md).
vault_integration_ldap_endpoint: ""           # REQUIRED: peer endpoint / issuer / URL (caller-supplied)
vault_integration_ldap_client_id: ""
vault_integration_ldap_client_secret: ""      # caller-supplied secret; never retrieved by this role
