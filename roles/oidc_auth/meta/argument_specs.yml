---
argument_specs:
  main:
    short_description: "oidc_auth integration for vault."
    options:
      vault_integration_oidc_endpoint:
        type: str
        required: true
        description: Peer endpoint/issuer/URL (caller-supplied; never discovered).
      vault_integration_oidc_client_id:
        type: str
        default: ""
        description: Client identifier for the peer.
      vault_integration_oidc_client_secret:
        type: str
        default: ""
        description: Caller-supplied client secret; never retrieved by this role.
